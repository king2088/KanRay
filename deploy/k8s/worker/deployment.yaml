apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kanray
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: kanray-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "backend/src/worker/main.js"]
          envFrom:
            - configMapRef:
                name: kanray-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanray-secrets
                  key: JWT_SECRET
            - name: DATASOURCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanray-secrets
                  key: DATASOURCE_SECRET
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: kanray-secrets
                  key: DB_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kanray-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: kanray-data
              mountPath: /data
            - name: kanray-uploads
              mountPath: /uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: kanray-data
          persistentVolumeClaim:
            claimName: kanray-data
        - name: kanray-uploads
          persistentVolumeClaim:
            claimName: kanray-uploads
  # 多副本 worker 需 kanray-data/kanray-uploads 为 ReadWriteMany 共享存储；
  # 任务领取由 sync_jobs 条件 UPDATE + 租约互斥，无需探针（依赖 SIGTERM 优雅退出与任务回收）。