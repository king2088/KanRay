# 可选 Ingress（需集群已安装 Ingress Controller，如 ingress-nginx）。
# 默认访问用 NodePort（frontend 服务 NodePort 30080）或 kubectl port-forward，无需本文件。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: kanban
spec:
  ingressClassName: nginx
  rules:
    - host: kanban.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80