# 单节点/本地集群（kind / minikube / k3s 等）测试示例。请勿用于多节点生产集群。
# 生产请替换为共享持久存储：kanray-data / kanray-uploads 多副本共享时需 ReadWriteMany
# （Longhorn / NFS / CSI 等）；postgres / redis 数据卷为 ReadWriteOnce，用存储类即可。
# 若改用存储类（如 local-path / standard），将下方 storageClassName: "" 改为存储类名并删除本文件。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kanray-pg-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/kanray/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kanray-redis-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/kanray/redis
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kanray-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/kanray/data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kanray-uploads-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/kanray/uploads
    type: DirectoryOrCreate