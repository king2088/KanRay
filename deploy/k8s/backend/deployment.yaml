apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kanban
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kanban-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: kanban-backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: JWT_SECRET
            - name: DATASOURCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: DATASOURCE_SECRET
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: DB_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: REDIS_URL
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: ADMIN_INITIAL_PASSWORD
          volumeMounts:
            - name: kanban-data
              mountPath: /data
            - name: kanban-uploads
              mountPath: /uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: kanban-data
          persistentVolumeClaim:
            claimName: kanban-data
        - name: kanban-uploads
          persistentVolumeClaim:
            claimName: kanban-uploads
  # 无状态 API：水平扩容改 replicas 与 DB_POOL_MAX（总连接 = 副本数 × poolMax）
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1