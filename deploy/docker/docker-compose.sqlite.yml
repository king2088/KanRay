name: kanray
# SQLite 演示 / 轻量单机栈（docker-compose.sqlite.yml）
# 特点：无需外部数据库、无 Redis、同步在 API 进程内执行（SYNC_MODE=inline）；
# 适用于本地演示、验收、单机小规模试用，不适合多副本（SQLite 单文件单写者）。
#
# 用法：
#   ./deploy.sh up --stack sqlite
#   或 STACK=sqlite ./deploy.sh up
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    env_file: .env
    environment:
      DB_TYPE: sqlite
      DB_PATH: /data/kanray.db
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      PORT: "3001"
      # 单进程内调度 + 执行同步；无 Redis，使用内存缓存 + sync_locks 表租约锁
      SYNC_MODE: inline
    volumes:
      - kanray_data:/data
      - kanray_uploads:/uploads
    expose:
      - "3001"
    # SQLite 单写者：不要对 backend 做 --scale 多副本
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
    ports:
      - "${KANRAY_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kanray_data:
  kanray_uploads:
