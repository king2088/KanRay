name: kanray
# MySQL 8.0 生产栈（docker-compose.mysql.yml）
# 默认使用 PG（docker-compose.yml）；本文件供选择 MySQL 作为元数据库时使用。
# 含 Redis（共享缓存/锁）与独立 worker（SYNC_MODE=worker）。
#
# 用法：
#   ./deploy.sh up --stack mysql
#   或 STACK=mysql ./deploy.sh up
#
# 注意：密码含 @ / : 等特殊字符时需在 DB_URL 中做 URL 编码（@ → %40）。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kanray}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kanray}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    env_file: .env
    environment:
      DB_TYPE: mysql
      DB_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-kanray}@mysql:3306/${MYSQL_DATABASE:-kanray}
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      PORT: "3001"
      SYNC_MODE: worker
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - kanray_data:/data
      - kanray_uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    command: ["node", "backend/src/worker/main.js"]
    env_file: .env
    environment:
      DB_TYPE: mysql
      DB_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-kanray}@mysql:3306/${MYSQL_DATABASE:-kanray}
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      SYNC_MODE: worker
      SYNC_MAX_CONCURRENT: "4"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - kanray_data:/data
      - kanray_uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1.5g

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
    ports:
      - "${KANRAY_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  mysqldata:
  redisdata:
  kanray_data:
  kanray_uploads:
