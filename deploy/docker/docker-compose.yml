services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 共享缓存 / 分布式锁；生产建议设密码（redis-server --requirepass）并同步覆盖 REDIS_URL
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    env_file: .env
    environment:
      DB_TYPE: postgres
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      PORT: "3001"
      # API 进程只入队，不执行同步（同步交给 worker 服务）
      SYNC_MODE: worker
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - kanray_data:/data
      - kanray_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped
    # 水平扩容：docker compose up -d --scale backend=3
    # 注意：连接总数为 副本数 × DB_POOL_MAX，需与 postgres max_connections 匹配。

  # 独立同步 worker：调度（入队）+ 消费 sync_jobs 执行同步；可独立水平扩容。
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    command: ["node", "backend/src/worker/main.js"]
    env_file: .env
    environment:
      DB_TYPE: postgres
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /data
      UPLOAD_DIR: /uploads
      SYNC_MODE: worker
      SYNC_MAX_CONCURRENT: "4"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - kanray_data:/data
      - kanray_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 水平扩容：docker compose up -d --scale worker=2（任务领取由 sync_jobs 行锁互斥）
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
    ports:
      - "${KANRAY_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kanray_data:
  kanray_uploads:
