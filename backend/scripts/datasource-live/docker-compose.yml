# P3 数据源接入 live 实测环境（13 容器：9 个 PHP 直连族 + hive/db2/dameng/impala 原生驱动族）
# 用法：
#   预下载镜像：docker compose -f backend/scripts/datasource-live/docker-compose.yml pull
#   启动：       docker compose -f backend/scripts/datasource-live/docker-compose.yml up -d
#   查看状态：   docker compose -f backend/scripts/datasource-live/docker-compose.yml ps
#   停止清理：   docker compose -f backend/scripts/datasource-live/docker-compose.yml down -v
# 说明：全部映射高位端口避免与本机冲突；统一测试密码 Kanban@123（仅本机测试用）。
#       db2/dameng/impala/hive 走 amd64 镜像（Linux 原生；macOS arm64 经 Rosetta，仅 hive/db2 等可跑）。
#       原生驱动家族真连还需本机安装原生驱动，见 verify-linux.md。
services:
  mysql:
    image: mysql:8.0
    container_name: kanban-live-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Kanban@123
      MYSQL_DATABASE: testdb
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pKanban@123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mariadb:
    image: mariadb:11
    container_name: kanban-live-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: Kanban@123
      MARIADB_DATABASE: testdb
    ports:
      - "13307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-pKanban@123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: kanban-live-postgres
    environment:
      POSTGRES_PASSWORD: Kanban@123
      POSTGRES_DB: testdb
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: kanban-live-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: Kanban@123
      CLICKHOUSE_DB: testdb
    ports:
      - "18123:8123"   # HTTP 接口（provider 走这个）
      - "19000:9000"   # native 接口（备用）
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "Kanban@123", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kanban-live-mssql
    platform: linux/amd64   # Apple Silicon 走 Rosetta 仿真；镜像较大（约 1.5GB），首次启动较慢
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Kanban@123
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -l 5"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  tidb:
    image: pingcap/tidb:v8.5.1
    container_name: kanban-live-tidb
    # 单容器开发形态：内嵌 unistore 存储，免 PD/TiKV；MySQL 协议在 4000 端口
    command: ["-store=unistore", "-path=/tmp/tidb"]
    ports:
      - "14000:4000"   # MySQL 协议
      - "14080:10080"  # 状态接口
    healthcheck:
      test: ["CMD-SHELL", "</dev/tcp/127.0.0.1/4000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: kanban-live-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # 测试环境关闭认证
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # P3 Presto 真连测试 —— 使用兼容同协议的 Trino 服务器（presto-client 走 REST）
  trino:
    image: trinodb/trino:476
    container_name: kanban-live-trino
    environment:
      TRINO_JVM_INITIAL_HEAP_SIZE: 256M
      TRINO_JVM_MAX_HEAP_SIZE: 512M
    mem_limit: 1.5g
    ports:
      - "18080:8080"   # REST / JDBC 接口
    healthcheck:
      test: ["CMD-SHELL", "/opt/trino/bin/trino --execute 'SELECT 1' --server localhost:8080 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # P3 Oracle 真连测试 —— Oracle 官方 Free 23ai 镜像（thin 模式连接 /FREEPDB1；amd64 走 Rosetta 仿真启动较慢）
  oracle:
    image: container-registry.oracle.com/database/free:23.4.0.0
    container_name: kanban-live-oracle
    environment:
      ORACLE_PWD: Kanban@123
    ports:
      - "11521:1521"   # SQL*NET 接口（服务名 FREEPDB1）
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1521'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  # ─── 以下 4 个为「原生驱动家族」：需 Linux + 原生驱动（ibm_db/odbc/hive-driver）才可真连 ───
  #   日志（macOS）说明见 scripts/datasource-live/verify-linux.md

  # P3 Hive HS2 真连测试 —— 官方 Hive（内嵌 Derby metastore；HS2 二进制协议 10000）
  hive:
    image: apache/hive:3.1.3
    container_name: kanban-live-hive
    platform: linux/amd64
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:derby:;databaseName=/opt/hive/metastore_db;create=true"
    ports:
      - "11000:10000"   # HS2 Thrift 二进制
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/10000 && /opt/hive/bin/beeline -u jdbc:hive2://localhost:10000 -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 30
      start_period: 90s

  # DB2 真连测试 —— IBM DB2 Community（需内核权限，Linux 下才可拉起）
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: kanban-live-db2
    platform: linux/amd64
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: Kanban@123
      DB2INSTANCE: db2inst1
    ports:
      - "50000:50000"
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to TESTDB' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 30
      start_period: 120s

  # 达梦 DM 真连测试 —— DM8 单实例社区镜像（macOS arm64 无官方驱动，仅在 Linux 真连）
  dameng:
    image: docker.io/qinjx/dm8-single
    container_name: kanban-live-dameng
    platform: linux/amd64
    environment:
      SYSDBA_PWD: SYSDBA001
      CASE_SENSITIVE: "0"
    ports:
      - "5236:5236"
    healthcheck:
      test: ["CMD-SHELL", "</dev/tcp/127.0.0.1/5236"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  # Impala 真连测试 —— Apache Impala 官方镜像（单节点 impalad+catalogd+statestored）
  impala:
    image: apache/impala:4.1.0
    container_name: kanban-live-impala
    platform: linux/amd64
    ports:
      - "21050:21050"   # HS2 协议
    healthcheck:
      test: ["CMD-SHELL", "</dev/tcp/127.0.0.1/21050"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
